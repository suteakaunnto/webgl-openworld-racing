<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開発用3Dモデル確認ツール — ゲーム本体とは別</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c12;color:#e8f0f7;font:13px "Yu Gothic UI",Meiryo,system-ui,sans-serif}
    #view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
    #panel{position:fixed;left:16px;bottom:16px;max-width:440px;padding:14px 16px;border:1px solid #385064;border-radius:10px;background:#07111ddd;backdrop-filter:blur(12px)}
    h1{font-size:14px;letter-spacing:.05em;margin:0 0 8px}p{font-size:11px;line-height:1.7;color:#b1c0cc;margin:0 0 8px}
    #stats{font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;color:#c9d8e4}
    #warning{color:#ffcf9f;font-weight:700}
    #error{position:fixed;inset:40% 16px auto;padding:15px;background:#320d12;color:#ffd8dc;white-space:pre-wrap;display:none}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="view"></main>
  <aside id="panel">
    <h1>開発用モデル確認ツール</h1>
    <p id="warning">この元モデルはCC BY 4.0のライセンス表示と作者クレジットを維持したうえで、ゲーム用車両の一部形状・素材のベースとして利用できます。</p>
    <p>ボンネット、前後フェンダー、バンパー、ドア、ガラス、ライト、ホイール、内装の形状と配置を確認してください。ゲームに使用する際はMazdaの実ロゴやブランド表示を隠し、変更内容をクレジットに記録します。</p>
    <div id="stats">ローカルの3Dモデルを読み込んでいます…</div>
  </aside>
  <pre id="error"></pre>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const container = document.querySelector("#view");
    const stats = document.querySelector("#stats");
    const error = document.querySelector("#error");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b121b);
    scene.add(new THREE.HemisphereLight(0xc7e1f2, 0x18212a, 1.5));
    const key = new THREE.DirectionalLight(0xffecd4, 3.2);
    key.position.set(5, 8, 6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x7aaed4, 2.1);
    fill.position.set(-7, 3, -5);
    scene.add(fill);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 300);
    camera.position.set(-5, 3, 6);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.7, 0);
    scene.add(new THREE.GridHelper(20, 40, 0x52758c, 0x1c2d3a));
    scene.add(new THREE.AxesHelper(2));

    const url = "../mazda_rx-7_spirit_r_type_a_2002__www.vecarz.com/scene.gltf";
    new GLTFLoader().load(url, (gltf) => {
      const root = gltf.scene;
      scene.add(root);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      const distance = Math.max(size.length() * 1.55, 5);
      camera.position.copy(center).add(new THREE.Vector3(-distance * 0.7, distance * 0.45, distance * 0.85));
      camera.near = Math.max(0.01, distance / 200);
      camera.far = distance * 100;
      camera.updateProjectionMatrix();

      let nodes = 0, meshes = 0, triangles = 0;
      const materials = new Set();
      root.traverse((object) => {
        nodes++;
        if (!object.isMesh) return;
        meshes++;
        const mesh = object;
        const count = mesh.geometry.index?.count ?? mesh.geometry.getAttribute("position")?.count ?? 0;
        triangles += Math.floor(count / 3);
        if (Array.isArray(mesh.material)) mesh.material.forEach((m) => materials.add(m));
        else if (mesh.material) materials.add(mesh.material);
      });
      stats.textContent =
        "ノード数      " + nodes + "\n" +
        "メッシュ数    " + meshes + "\n" +
        "マテリアル数  " + materials.size + "\n" +
        "三角形数      " + triangles.toLocaleString("ja-JP") + "\n" +
        "外形寸法      " + size.x.toFixed(3) + " × " + size.y.toFixed(3) + " × " + size.z.toFixed(3) + "\n" +
        "出典          CC BY 4.0 / vecarz";
    }, undefined, (cause) => {
      error.style.display = "block";
      error.textContent = "開発用モデルを読み込めませんでした。\n" + String(cause) +
        "\n\nリポジトリのルートからローカルWebサーバーを起動して、/tools/reference-inspector.html を開いてください。";
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    function frame() {
      requestAnimationFrame(frame);
      controls.update();
      renderer.render(scene, camera);
    }
    frame();
  </script>
</body>
</html>
