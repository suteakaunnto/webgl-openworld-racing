name: M0 Build Verification

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, bundle, and pack
        run: npm run verify

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: kitebound-m0-standalone-html
          path: dist/index.html
          if-no-files-found: error
